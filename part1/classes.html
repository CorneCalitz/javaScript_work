<html><body><script>

// A class is a template for making standardized objects.

// A class lays out two main things:
// - What properties each object of that class should have
// - What functions the object should have access to. (Functions apart of a clas are called methods)

// Inheritance is a mechanism in oop for defining relationships between classes.
// A child class inherits methods from a parent class.
// Parent class = superclass, child class = subclass


// Classes like actor whic are meant to be extended by subclasses are known as abstract classes.
// Classes that are instantiated such as player and enemy are concrete classes.
class Actor {
    constructor(startX, startY) {
        this.x = startX;
        this.y = startY;
    }

    move(dx, dy) {
        this.x += dx;
        this.y += dy;
    }

    distanceTo(otherActor) {
        let dx = otherActor.x - this.x;
        let dy = otherActor.y - this.y;
        return Math.hypot(dx, dy);
    }
}

class Player extends Actor{
    constructor(startX, startY) {
        super(startX, startY);
        this.hp = 100;

    }

}
// Enemy does not need a hp bar. When a subclass does not define a constructor,
// it's parent class's constructor is automatically called.
class Enemy extends Actor {
    attack(player) {
        if (this.distanceTo(player) < 4) {
            player.hp -= 10;
            return true;

        } else {
            return false;
        }
    }
}

class Follower extends Actor {
    constructor(startX, startY, player) {
        super(startX, startY);
        this.player = player;
    }

    follow(player) {
        this.x = player.x;
        this.y = player.y;
    }
}
    


//Instace of a player class
let player1 = new Player(0, 0);
player1.move(3, 5);
console.log(player1.x, player1.y)

let player2 = new Player(0, 0);
player2.move(10, -2);
console.log(player2.x, player2.y)


let player = new Player(1, 2);
let enemy = new Enemy(3, 4);
console.log(player.hp);
console.log(enemy.distanceTo(player));
console.log(enemy.attack(player));
console.log(player.hp);
player.move(5, 5);
console.log(enemy.attack(player));
console.log(player.hp);


// Use the instanceOf keyword to test whether an object is an instance of a class.
console.log(player instanceof Player);
console.log(player instanceof Enemy);
console.log(player instanceof Actor);
console.log(enemy instanceof Actor);


let follower = new Follower(0, 0, player);
console.log(player.x, player.y)
console.log(follower.x, follower.y);
follower.follow(player);
console.log(follower.x, follower.y);

</script></body></html>
