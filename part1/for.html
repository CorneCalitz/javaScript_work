<html><body><script>

// initialize looping variable.
// set looping condition.
// update the looping variable, will occur after each repetition of the loop.

for (let speed = 30; speed > 25; speed--) {
    console.log(`Current speed is ${speed} mph`)
}

// The speed variable exists only within the scope of the for loop.
// Variables defined within any condition can only be accessed from within the scope of the condition or loop
</script></body></html>
