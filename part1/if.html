<html><body><script>
let speed = 30;
console.log(`Current speed is ${speed} mph.`);
if (speed > 25) {
    console.log('Slow down!');
} else {
    console.log('You are obeying the speed limit.');
}

let hour = 19;
// Complex conditional statements can be rewritten as one line by declaring it as a boolean expression
let schoolHours = hour > 7 && hour < 16;

if (speed > 25 && schoolHours) {
    console.log('You are speeding during school hours')
}
</script></body></html>
