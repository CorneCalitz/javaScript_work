<html><body><script>

//for..in loop cycles through the keys in an object. 
//This applies only to objects and not arrays.

let me = { 
  "first name": "John", 
  "last name": "Smith", 
  "age": 39 
}; 

for (let key in me) {
     console.log(`My ${key} is ${me[key]}.`);
}

//Alternatively
for (let [key, value] of Object.entries(me)) {
     console.log(`My ${key} is ${value}.`);
}
</script></body></html>
